
name: Java PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  compile:
    name: Compile Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile all Java files
        shell: bash
        run: |
          mkdir -p out
          mapfile -d '' files < <(
            find . -type f -name '*.java' \
              -not -path './.git/*' \
              -not -path './out/*' \
              -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Java files found"
            exit 1
          fi

          javac -d out "${files[@]}"
